name: Build SEO cover WebP

on:
  push:
    paths:
      - ".github/workflows/seo-cover-webp.yml"

permissions:
  contents: write

jobs:
  build-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin webp

      - name: Convert SVG covers to WebP
        run: |
          set -e
          for name in             quake-champions-1-31-cover             valorant-patch-13-06-cover             free-fire-naruto-ob55-cover
          do
            rsvg-convert -w 1200 -h 675 "assets/blog/${name}.svg" -o "/tmp/${name}.png"
            cwebp -quiet -q 82 "/tmp/${name}.png" -o "assets/blog/${name}.webp"
          done

      - name: Commit optimized covers
        run: |
          git config user.name "MarcelloArt SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/blog/*-cover.webp
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Add optimized WebP covers for SEO"
          git push
