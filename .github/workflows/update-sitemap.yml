name: Keep sitemap in sync

on:
  push:
    branches:
      - main
    paths:
      - "blog/**/*.html"
      - "scripts/update_sitemap.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Synchronize sitemap
        run: python scripts/update_sitemap.py

      - name: Commit sitemap changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "SEO: sync sitemap with blog articles"
          git push
