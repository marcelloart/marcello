<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Pengaturan Grafis Coin Rush 3D untuk Android</title>
<desc id="desc">Tiga preset grafis Rendah, Sedang, dan Tinggi untuk memilih tampilan yang stabil di perangkat Android.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071631"/><stop offset=".55" stop-color="#123d88"/><stop offset="1" stop-color="#0b82d0"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a2"/><stop offset=".4" stop-color="#ffd342"/><stop offset="1" stop-color="#ed9200"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="34" fill="url(#bg)"/><circle cx="1065" cy="95" r="240" fill="#45cfff" opacity=".12"/><circle cx="135" cy="610" r="260" fill="#ffd34b" opacity=".08"/>
<path d="M0 570Q300 480 600 570T1200 515V675H0Z" fill="#061224" opacity=".42"/>
<text x="78" y="105" fill="#ffd342" font-family="Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="3">COIN RUSH 3D</text>
<text x="78" y="225" fill="#fff" font-family="Arial,sans-serif" font-size="71" font-weight="900" letter-spacing="-2">ATUR GRAFIS</text>
<text x="82" y="294" fill="#dcecff" font-family="Arial,sans-serif" font-size="26">Sesuaikan dengan performa Android</text>
<rect x="80" y="345" width="428" height="60" rx="18" fill="#0b58b8" stroke="#63d9ff" stroke-width="2"/>
<text x="294" y="383" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1">3 PRESET GRAFIS</text>
<text x="82" y="485" fill="#9edaff" font-family="Arial,sans-serif" font-size="20" font-weight="700">HALUS &amp; RESPONSIF DI TIAP CHECKPOINT</text>
<g transform="translate(700 100)">
  <rect width="360" height="445" rx="38" fill="#07101f" stroke="#a8c8e8" stroke-opacity=".32" stroke-width="4"/>
  <rect x="24" y="25" width="312" height="395" rx="26" fill="#102949"/>
  <text x="56" y="78" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="800">KUALITAS GRAFIS</text>
  <g font-family="Arial,sans-serif" font-size="20" font-weight="800">
    <rect x="48" y="110" width="264" height="77" rx="16" fill="#0a315e" stroke="#398bd0" stroke-width="2"/><circle cx="82" cy="148" r="18" fill="#45cfff"/><text x="118" y="155" fill="#eaf7ff">RENDAH</text><path d="M273 148h18" stroke="#45cfff" stroke-width="5" stroke-linecap="round"/>
    <rect x="48" y="207" width="264" height="77" rx="16" fill="#124681" stroke="#62ddff" stroke-width="3"/><circle cx="82" cy="245" r="18" fill="#ffd342"/><text x="118" y="252" fill="#fff">SEDANG</text><path d="m269 245 8 8 16-19" fill="none" stroke="#72ffc1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="304" width="264" height="77" rx="16" fill="#0a315e" stroke="#398bd0" stroke-width="2"/><circle cx="82" cy="342" r="18" fill="#ff779e"/><text x="118" y="349" fill="#eaf7ff">TINGGI</text><path d="M273 342h18" stroke="#45cfff" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>
<text x="770" y="596" fill="#b8cde2" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">COBA DI LEVEL YANG SAMA</text>
