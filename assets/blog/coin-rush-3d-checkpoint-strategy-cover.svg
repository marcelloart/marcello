<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Panduan Checkpoint Level 10 sampai 100 Coin Rush 3D</title>
<desc id="desc">Lintasan checkpoint dan strategi power-up untuk sepuluh tantangan Coin Rush 3D.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071631"/><stop offset=".55" stop-color="#123d88"/><stop offset="1" stop-color="#0b82d0"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1a2"/><stop offset=".4" stop-color="#ffd342"/><stop offset="1" stop-color="#ed9200"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="34" fill="url(#bg)"/><circle cx="1080" cy="100" r="230" fill="#45cfff" opacity=".12"/><circle cx="130" cy="605" r="255" fill="#ffd34b" opacity=".08"/>
<path d="M0 572 250 510 465 565 710 480 920 535 1200 445V675H0Z" fill="#061224" opacity=".42"/>
<text x="78" y="105" fill="#ffd342" font-family="Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="3">COIN RUSH 3D</text>
<text x="78" y="225" fill="#fff" font-family="Arial,sans-serif" font-size="61" font-weight="900" letter-spacing="-2">CHECKPOINT</text>
<text x="78" y="303" fill="url(#gold)" font-family="Arial,sans-serif" font-size="73" font-weight="900" letter-spacing="-2">LEVEL 10–100</text>
<text x="82" y="365" fill="#dcecff" font-family="Arial,sans-serif" font-size="27">Strategi menghadapi tiap tantangan</text>
<rect x="80" y="412" width="420" height="58" rx="18" fill="#0b58b8" stroke="#63d9ff" stroke-width="2"/>
<text x="290" y="449" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="1.3">RUTE • WAKTU • POWER-UP</text>
<g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">
  <path d="M702 370C800 190 925 460 1045 255" fill="none" stroke="#62ddff" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 20"/>
  <circle cx="700" cy="370" r="58" fill="#0a4d91" stroke="#62ddff" stroke-width="5"/><text x="700" y="379" fill="#fff" font-size="27">10</text>
  <circle cx="820" cy="290" r="47" fill="#0a4d91" stroke="#62ddff" stroke-width="5"/><text x="820" y="298" fill="#fff" font-size="23">30</text>
  <circle cx="930" cy="370" r="47" fill="#0a4d91" stroke="#62ddff" stroke-width="5"/><text x="930" y="378" fill="#fff" font-size="23">60</text>
  <circle cx="1047" cy="255" r="65" fill="url(#gold)" stroke="#fff0a0" stroke-width="5"/><text x="1047" y="264" fill="#704700" font-size="29">100</text>
