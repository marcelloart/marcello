<text x="707" y="552" fill="#dcecff" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1.6">10 TANTANGAN CHECKPOINT</text>
<text x="82" y="580" fill="#b8cde2" font-family="Arial,sans-serif" font-size="19" font-weight="700">Setiap 10 level, evaluasi stok dan rencanakan pemakaian power-up.</text>
